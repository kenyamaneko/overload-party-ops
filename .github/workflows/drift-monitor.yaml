name: Drift Monitor

on:
  schedule:
    # 7:00 AM JST = 22:00 UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: drift-monitor-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OPS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: Run drift check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TF_VAR_cloudflare_cdn_api_token: ${{ secrets.CLOUDFLARE_CDN_API_TOKEN }}
          TF_VAR_cloudflare_workers_api_token: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          TF_VAR_upstash_email: ${{ vars.UPSTASH_EMAIL }}
          TF_VAR_upstash_api_key: ${{ secrets.UPSTASH_API_KEY }}
        run: python3 drift-monitor/check.py
