# 各サービスリポの main push、または手動 dispatch で発火。
# schemas.lock.yaml に列挙された全サービスの db/schema.sql を union し psqldef で一括適用。
#
# 自動トリガー:
#   - どの service repo が main に push しても repository_dispatch(db-migrate) を
#     送出し、dev 環境に対して自動実行する。
#
# 手動トリガー:
#   - workflow_dispatch で環境 (dev/stg) + dry-run を選択可能。
name: "CD: DB Migration"

on:
  repository_dispatch:
    types: [db-migrate]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
      dry_run:
        description: "Dry-run only (schema diff without applying)"
        required: false
        type: boolean
        default: false
      bootstrap_baseline:
        description: "First apply for this environment (skip the destructive-change check and record the baseline)"
        required: false
        type: boolean
        default: false

concurrency:
  group: db-migrate-${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  AR_PROJECT: keyandnotes-platform
  AR_REPOSITORY: overload-party
  IMAGE_NAME: db-migrate
  PROJECTS: '{"dev":"overload-party-dev","stg":"overload-party-stg"}'
  BASELINE_UNION: /tmp/schema_union.applied.sql
  CANDIDATE_UNION: db-migrate/sql/schema_union.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.environment }}

    env:
      ENV: ${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.environment }}

    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4

      - name: Resolve parameters
        id: params
        env:
          PROJECTS: ${{ env.PROJECTS }}
          TARGET_ENV: ${{ env.ENV }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_SHA: ${{ github.sha }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BOOTSTRAP_BASELINE: ${{ inputs.bootstrap_baseline }}
        run: .github/scripts/db-migrate/resolve-params.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Generate Cross-Repo Deps App token
        id: cross-repo-deps-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: Build schema union (current HEAD of schemas.lock.yaml)
        env:
          DB_MIGRATE_TOKEN: ${{ steps.cross-repo-deps-token.outputs.token }}
        run: |
          python3 db-migrate/fetch-schemas.py \
            --lock db-migrate/schemas.lock.yaml \
            --out "$CANDIDATE_UNION" \
            --seed-out db-migrate/sql/seed_union.sql \
            --grant-src db-migrate/grant_iam.sql \
            --workdir /tmp/schema-src-new

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DB_MIGRATOR_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Schema safety check against the union applied to this environment
        env:
          BOOTSTRAP_BASELINE: ${{ steps.params.outputs.bootstrap_baseline }}
        run: .github/scripts/db-migrate/check-schema-safety.sh

      - name: Build and push migration image
        run: db-migrate/build-push.sh
        env:
          IMAGE_SHA: ${{ steps.params.outputs.image_sha }}

      - name: Ensure Cloud SQL instance is running
        run: db-migrate/ensure-sql-running.sh
        env:
          CLOUDSQL_INSTANCE_NAME: ${{ vars.CLOUDSQL_INSTANCE_NAME }}
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Update Cloud Run Job image
        run: db-migrate/update-job-image.sh
        env:
          IMAGE_SHA: ${{ steps.params.outputs.image_sha }}
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Execute migration job
        if: steps.params.outputs.dry_run != 'true'
        run: db-migrate/execute-job.sh
        env:
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Record applied schema union
        if: steps.params.outputs.dry_run != 'true'
        run: db-migrate/record-applied-union.sh

      - name: Dry-run notice
        if: steps.params.outputs.dry_run == 'true'
        run: echo "Dry-run mode — image updated but job was NOT executed."
