# common リポの main push で dev 自動実行 / 手動で環境選択実行
name: "CD: DB Migration"

on:
  repository_dispatch:
    types: [db-migrate]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
      dry_run:
        description: "Dry-run only (schema diff without applying)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  AR_PROJECT: keyandnotes-platform
  AR_REPOSITORY: overload-party
  IMAGE_NAME: db-migrate
  PROJECTS: '{"dev":"overload-party-dev","stg":"overload-party-stg"}'

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.environment }}

    env:
      ENV: ${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.environment }}

    steps:
      - name: Resolve parameters
        id: params
        run: |
          echo "project=$(echo '${{ env.PROJECTS }}' | jq -r '.\"${{ env.ENV }}\"')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "common_ref=${{ github.event.client_payload.sha || 'main' }}" >> "$GITHUB_OUTPUT"
            echo "image_sha=${{ github.event.client_payload.sha || github.sha }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "common_ref=main" >> "$GITHUB_OUTPUT"
            echo "image_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ops repo
        uses: actions/checkout@v4

      - name: Checkout common repo (SQL files only)
        uses: actions/checkout@v4
        with:
          repository: kenyamaneko/overload-party-common
          token: ${{ secrets.DB_MIGRATE_TOKEN }}
          ref: ${{ steps.params.outputs.common_ref }}
          path: common
          sparse-checkout: db/

      - name: Copy SQL files into build context
        run: |
          mkdir -p db-migrate/sql
          cp common/db/schema_postgres.sql db-migrate/sql/
          cp common/db/grant_iam.sql db-migrate/sql/

      - name: Get previous schema for safety check
        run: |
          cd common
          git show HEAD~1:db/schema_postgres.sql > /tmp/schema_old.sql 2>/dev/null || touch /tmp/schema_old.sql

      - name: Schema safety check
        run: python3 db-migrate/schema_check.py /tmp/schema_old.sql db-migrate/sql/schema_postgres.sql

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push migration image
        run: db-migrate/build-push.sh
        env:
          IMAGE_SHA: ${{ steps.params.outputs.image_sha }}

      - name: Ensure Cloud SQL instance is running
        run: db-migrate/ensure-sql-running.sh
        env:
          CLOUDSQL_INSTANCE_NAME: ${{ vars.CLOUDSQL_INSTANCE_NAME }}
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Update Cloud Run Job image
        run: db-migrate/update-job-image.sh
        env:
          IMAGE_SHA: ${{ steps.params.outputs.image_sha }}
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Execute migration job
        if: steps.params.outputs.dry_run != 'true'
        run: db-migrate/execute-job.sh
        env:
          PROJECT: ${{ steps.params.outputs.project }}

      - name: Dry-run notice
        if: steps.params.outputs.dry_run == 'true'
        run: echo "Dry-run mode — image updated but job was NOT executed."
