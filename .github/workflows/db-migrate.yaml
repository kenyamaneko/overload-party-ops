# 手動トリガー（workflow_dispatch）。dev/stg を選択して実行する。
# dry_run=true にするとイメージ更新のみでジョブは実行しない。
name: DB Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stg
      dry_run:
        description: "Dry-run only (schema diff without applying)"
        required: false
        type: boolean
        default: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.config.outputs.project }}
    steps:
      - name: Set project ID
        id: config
        run: |
          case "${{ inputs.environment }}" in
            dev)  echo "project=overload-party-dev" >> "$GITHUB_OUTPUT" ;;
            stg)  echo "project=overload-party-stg" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Unsupported environment"; exit 1 ;;
          esac

  migrate:
    needs: config
    uses: ./.github/workflows/db-migrate-job.yaml
    with:
      environment: ${{ inputs.environment }}
      project: ${{ needs.config.outputs.project }}
      image_sha: ${{ github.sha }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
