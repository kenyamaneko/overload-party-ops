# Nightly Review の実行トリガ。Cloud Run Jobs を --async で起動するだけ。
# レビュー本体のビルド / デプロイは nightly-review-deploy.yaml が担当する。
#
# --async を外すと実行完了まで Actions runner が待つことになり、Claude API の
# 429 バックオフで毎晩 10 分ほど課金される問題が再発する。fire-and-forget で
# 起動し、結果通知は Python 側（review.py）が Slack に直接送る前提。
name: Nightly Review

on:
  schedule:
    # 3:00 AM JST = 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  PROJECT: overload-party-ops
  CLOUD_RUN_JOB: nightly-review

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # notify-failure.sh を failure() 時に実行できるようにするため checkout する。
      # execute 自体は外部 API 呼び出しだけでリポジトリのファイルを必要としないが、
      # 失敗通知経路が silent に壊れるのを防ぐ目的でこのステップを置いている。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run Job (async)
        run: |
          gcloud run jobs execute "${CLOUD_RUN_JOB}" \
            --region "${REGION}" \
            --project "${PROJECT}" \
            --async

      - name: Notify Slack on failure
        # ここが発火するのは「execute API 呼び出し自体が失敗した時」のみ。
        # レビュー処理中のエラー通知は review.py が Slack に直接送っているため、
        # このステップは意図的に二重通知していない。
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash nightly-review/notify-failure.sh
