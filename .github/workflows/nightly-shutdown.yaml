name: Nightly Shutdown (dev/stg)

on:
  schedule:
    # 2:00 AM JST = 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to shut down"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg

permissions:
  contents: read
  id-token: write

env:
  GKE_CLUSTER: keyandnotes-shared
  GKE_REGION: asia-northeast1
  GKE_PROJECT: keyandnotes-platform

# Cloud SQL instance name (same across dev/stg, different projects)
# Project ID: overload-party-{env}

jobs:
  shutdown:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ github.event_name == 'schedule' && fromJson('["dev"]') || fromJson(format('["{0}"]', github.event.inputs.environment)) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Setup GKE credentials
        id: gke-auth
        continue-on-error: true
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.GKE_PROJECT }}

      - name: Shutdown resources
        id: shutdown
        env:
          ENV: ${{ matrix.env }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DNS_RECORD_ID_DEV: ${{ vars.CLOUDFLARE_DNS_RECORD_ID_DEV }}
          CLOUDFLARE_DNS_RECORD_ID_STG: ${{ vars.CLOUDFLARE_DNS_RECORD_ID_STG }}
          GKE_AUTH_OK: ${{ steps.gke-auth.outcome == 'success' }}
        run: bash nightly-shutdown/shutdown.sh

      - name: Notify Slack
        if: always()
        env:
          ENV: ${{ matrix.env }}
          HAS_ERROR: ${{ steps.shutdown.outputs.has_error }}
          RESULTS: ${{ steps.shutdown.outputs.results }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash nightly-shutdown/notify.sh
