name: Nightly Shutdown Dispatcher

# ADR「ノードプールスケーリング戦略とGKEの所有権」の所有権原則に基づき、
# 実処理は各リソースの所有リポに集約。このワークフローはスケジューラとして
# それらを workflow_dispatch で呼び出すだけにとどめる。
# - GKE / Ingress / DNS / PSC : overload-party-k8s/env-lifecycle.yaml (action=down)
# - Cloud SQL                 : overload-party-infra/cloudsql-activation.yaml (action=down)
# - Node pool resize          : env-lifecycle が platform リポに連鎖 dispatch する

on:
  schedule:
    # 2:00 AM JST = 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to shut down"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg

concurrency:
  group: nightly-shutdown-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        env: ${{ github.event_name == 'schedule' && fromJson('["dev", "stg"]') || fromJson(format('["{0}"]', github.event.inputs.environment)) }}
      fail-fast: false
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OPS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      # env-lifecycle の down が GKE / Ingress / DNS / PSC のクリーンアップと
      # platform への node-pool-scale down dispatch までをまとめて担う。
      - name: Dispatch env-lifecycle down
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: env-lifecycle.yaml
          repo: kenyamaneko/overload-party-k8s
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: '{"action": "down", "environment": "${{ matrix.env }}", "slack_notification": "true"}'
          wait-for-completion: true
          wait-timeout-seconds: 1200

      # Cloud SQL は infra 所有。env-lifecycle 完了後に停止する。
      - name: Dispatch Cloud SQL down
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: cloudsql-activation.yaml
          repo: kenyamaneko/overload-party-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: '{"action": "down", "environment": "${{ matrix.env }}"}'
          wait-for-completion: true
          wait-timeout-seconds: 600
