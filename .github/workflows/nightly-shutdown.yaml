name: Nightly Shutdown Dispatcher

# 実処理はリソースの所有リポに集約し、このワークフローはスケジューラとして
# workflow_dispatch で呼び出すだけにとどめる。
# - Cloud SQL : overload-party-infra/cloudsql-activation.yaml (action=down)

on:
  schedule:
    # 2:00 AM JST = 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to shut down"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg

concurrency:
  group: nightly-shutdown-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        env: ${{ github.event_name == 'schedule' && fromJson('["dev", "stg"]') || fromJson(format('["{0}"]', github.event.inputs.environment)) }}
      fail-fast: false
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OPS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      # Cloud SQL は infra 所有。
      - name: Dispatch Cloud SQL down
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: cloudsql-activation.yaml
          repo: kenyamaneko/overload-party-infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: '{"action": "down", "environment": "${{ matrix.env }}"}'
          wait-for-completion: true
          wait-timeout-seconds: 600
