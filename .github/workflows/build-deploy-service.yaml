# ops サービス共通のビルド・デプロイ。caller workflow から workflow_call で呼び出す。
name: "CD: Build and Deploy Service"

on:
  workflow_call:
    inputs:
      service_dir:
        description: "Build context directory (e.g. slack-commands)"
        required: true
        type: string
      image_name:
        description: "Image name in Artifact Registry"
        required: true
        type: string
      cloud_run_service:
        description: "Cloud Run Service name to update"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  AR_PROJECT: keyandnotes-platform
  AR_REPOSITORY: overload-party
  PROJECT: overload-party-ops

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          AR_PROJECT: ${{ env.AR_PROJECT }}
          AR_REPOSITORY: ${{ env.AR_REPOSITORY }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SERVICE_DIR: ${{ inputs.service_dir }}
          GIT_SHA: ${{ github.sha }}
        run: .github/scripts/build-deploy-service/build-push-image.sh

      - name: Update Cloud Run Service
        env:
          REGISTRY: ${{ env.REGISTRY }}
          AR_PROJECT: ${{ env.AR_PROJECT }}
          AR_REPOSITORY: ${{ env.AR_REPOSITORY }}
          IMAGE_NAME: ${{ inputs.image_name }}
          GIT_SHA: ${{ github.sha }}
          CLOUD_RUN_SERVICE: ${{ inputs.cloud_run_service }}
          REGION: ${{ env.REGION }}
          PROJECT: ${{ env.PROJECT }}
        run: .github/scripts/build-deploy-service/update-cloud-run.sh
