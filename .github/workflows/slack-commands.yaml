name: "CD: Slack Commands"

on:
  push:
    branches: [main]
    paths: [slack-commands/**]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: slack-commands/requirements.txt

      - name: Install dependencies
        working-directory: slack-commands
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: slack-commands
        run: pytest

  build-deploy:
    needs: test
    uses: ./.github/workflows/build-deploy-service.yaml
    with:
      service_dir: slack-commands
      image_name: slack-commands
      cloud_run_service: slack-commands
    secrets: inherit
