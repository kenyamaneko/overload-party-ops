# Nightly Review コンテナの build / push / Cloud Run Job のイメージ更新。
# 実行（毎日の夜間レビュー起動）は nightly-review.yaml が別枠で担当する。
name: "CD: Nightly Review Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "nightly-review/**"
      - ".github/workflows/nightly-review-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  AR_PROJECT: keyandnotes-platform
  AR_REPOSITORY: overload-party
  IMAGE_NAME: nightly-review
  PROJECT: overload-party-ops
  CLOUD_RUN_JOB: nightly-review

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        env:
          REGISTRY: ${{ env.REGISTRY }}
          AR_PROJECT: ${{ env.AR_PROJECT }}
          AR_REPOSITORY: ${{ env.AR_REPOSITORY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: nightly-review/build-push.sh

      - name: Update Cloud Run Job image
        run: |
          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --image "${REGISTRY}/${AR_PROJECT}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT}" \
            --quiet
