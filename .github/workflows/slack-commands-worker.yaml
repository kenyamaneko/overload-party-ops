name: "CD: Slack Commands Worker"

on:
  push:
    branches: [main]
    paths: [slack-commands-worker/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: slack-commands-worker
        run: npm ci

      - name: Verify CLOUD_RUN_URL points to a live service
        env:
          WRANGLER_TOML: slack-commands-worker/wrangler.toml
        run: .github/scripts/slack-commands-worker/verify-cloud-run-url.sh

      - name: Deploy Worker
        working-directory: slack-commands-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
