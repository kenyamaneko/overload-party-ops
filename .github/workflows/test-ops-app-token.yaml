name: Test App Tokens (Ops Automation / Cross-Repo Deps)

# ADR-033 / issue #18 で導入する 2 つの GitHub App
# (overload-party-ops-automation / overload-party-cross-repo-deps) の
# 動作確認用一時 workflow。両 App について App ID + private key の組み合わせ・
# インストール範囲・取得 token 経由でのリポ可視範囲を確認する。
# 両 App の検証完了後に本ファイルは削除する。

on:
  workflow_dispatch:

permissions: {}

jobs:
  ops-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Ops Automation App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OPS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OPS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: List installation repositories (Ops Automation)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /installation/repositories \
            --jq '"total: \(.total_count)", (.repositories[].full_name)'

  cross-repo-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Cross-Repo Deps App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CROSS_REPO_DEPS_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_DEPS_APP_PRIVATE_KEY }}
          owner: kenyamaneko

      - name: List installation repositories (Cross-Repo Deps)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /installation/repositories \
            --jq '"total: \(.total_count)", (.repositories[].full_name)'
