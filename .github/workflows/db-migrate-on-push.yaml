# 自動トリガー（repository_dispatch）。common リポの main push 時に発火する。
# dev 環境のみ対象。dry_run なし（常に実行）。
name: DB Migration (auto)

on:
  repository_dispatch:
    types: [db-migrate]

jobs:
  migrate:
    uses: ./.github/workflows/db-migrate-job.yaml
    with:
      environment: dev
      project: overload-party-dev
      common_ref: ${{ github.event.client_payload.sha || 'main' }}
      image_sha: ${{ github.event.client_payload.sha || github.sha }}
    secrets: inherit
