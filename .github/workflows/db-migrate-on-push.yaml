# common リポの main push 時に repository_dispatch で呼ばれる。
# dev 環境に対して自動マイグレーションを実行する。
name: DB Migration (auto)

on:
  repository_dispatch:
    types: [db-migrate]

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  AR_PROJECT: overload-party-shared
  AR_REPOSITORY: overload-party
  IMAGE_NAME: db-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4

      - name: Checkout common repo (SQL files only)
        uses: actions/checkout@v4
        with:
          repository: kenyamaneko/overload-party-common
          token: ${{ secrets.COMMON_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: common
          sparse-checkout: db/

      - name: Copy SQL files into build context
        run: |
          mkdir -p db-migrate/sql
          cp common/db/schema_postgres.sql db-migrate/sql/
          cp common/db/grant_iam.sql db-migrate/sql/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push migration image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.AR_PROJECT }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          SHA=${{ github.event.client_payload.sha || github.sha }}
          docker build \
            -t ${IMAGE}:${SHA} \
            -t ${IMAGE}:latest \
            db-migrate/
          docker push ${IMAGE}:${SHA}
          docker push ${IMAGE}:latest

      - name: Ensure Cloud SQL instance is running
        run: |
          gcloud sql instances patch ${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --project=overload-party-dev \
            --activation-policy=ALWAYS --quiet
          echo "Waiting for instance to become RUNNABLE..."
          for i in $(seq 1 60); do
            STATE=$(gcloud sql instances describe ${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
              --project=overload-party-dev --format='value(state)')
            if [ "$STATE" = "RUNNABLE" ]; then
              echo "Instance is RUNNABLE (attempt ${i})"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Instance failed to become RUNNABLE (state: ${STATE})"
              exit 1
            fi
            sleep 5
          done

      - name: Update Cloud Run Job image
        run: |
          SHA=${{ github.event.client_payload.sha || github.sha }}
          IMAGE=${{ env.REGISTRY }}/${{ env.AR_PROJECT }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${SHA}
          gcloud run jobs update db-migrate \
            --region ${{ env.REGION }} \
            --project overload-party-dev \
            --image "${IMAGE}" \
            --quiet

      - name: Execute migration job
        run: |
          gcloud run jobs execute db-migrate \
            --region ${{ env.REGION }} \
            --project overload-party-dev \
            --wait \
            --quiet
