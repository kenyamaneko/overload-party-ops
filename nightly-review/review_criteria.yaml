# Nightly レビューで Claude に渡すレビュー観点。
# カテゴリ単位でまとめ、プロンプト上では「## {カテゴリ名}」セクションとして展開される。
# Why: 観点を Python コードから分離し、エンジニア以外でも追加・修正できるようにするため。
categories:
  - name: 設計
    items:
      - 設計通りに実装されているか（設計ドキュメント・既存設計と実装の整合性）
      - 拡張性と保守性が高い設計であること
      - 同じような処理を複数箇所に書いていないか
      - 場当たり的なワークアラウンドで設計を汚していないか
  - name: バグ・セキュリティ
    items:
      - バグのリスクがないか
      - セキュリティリスクがないか
  - name: コード品質
    items:
      - 使用していないコードがないか
      - 未実装のTODOがないか
  - name: 構成・ドキュメント
    items:
      - ディレクトリ構成が整理されているか
      - ドキュメントとコードの乖離がないか
  - name: エラーハンドリング
    items:
      - エラーハンドリングが適切か（エラーを握りつぶしていないか）
  - name: テスト
    items:
      - テストコードは仕様に沿っているか
      - テストコードのデータパターンが十分か
      - テストを通すために設計を汚していないか
      - 実装をなぞるだけのテストになっていないか（仕様ベースになっているか）
  - name: コメント
    items:
      - 実装をなぞるだけのコメントがないか（Docコメントは除く）
      - 実装意図がわかりにくい箇所に意図を表すコメントがあるか
  - name: 責務分離
    items:
      - ファイル・クラス・関数の責務が明確に分離されているか
      - リポジトリ間の責務が明確に分離されているか
  - name: 共通化
    items:
      - 通信用の文字列（エンドポイント、イベント名、ヘッダ名、トピック名など）はリテラル直書きではなく共通パッケージの定数を使っているか
